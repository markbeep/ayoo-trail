[package]
name = "trail-route"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false

[lib]
name = "trail_route"
path = "src/lib.rs"

[[bin]]
name = "trail-server"
path = "src/bin/server.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
rstar = "0.12"
bytemuck = "1"
memmap2 = "0.9"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
osmpbf = "0.3.8"
roxmltree = "0.21"
geo = "0.33"
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
rayon = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
