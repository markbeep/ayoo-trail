[package]
name = "navilau"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false

[lib]
name = "navilau"
path = "src/lib.rs"

[[bin]]
name = "navilau-server"
path = "src/bin/server.rs"

[[bin]]
name = "navilau-import"
path = "src/bin/import.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
rstar = "0.12"
bytemuck = "1"
memmap2 = "0.9"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
osmpbf = "0.3.8"
roxmltree = "0.21"
geo = "0.33"
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
rayon = "1"
weezl = "0.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
clap = { version = "4.6.8", features = ["derive", "env"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
