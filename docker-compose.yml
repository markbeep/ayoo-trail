# `docker compose up --build`: builds the graph and the 360° view scores into ./data if missing, then serves on :8080.
# WINDY_API_KEY (optional) turns on the webcam overlay (D102).
# REGION=demo|ch picks what the import builds; it needs `just data REGION=...` to have filled data/raw.
services:
  import:
    build: .
    image: trail-calc
    entrypoint: ["/app/trail-calc-import"]
    environment:
      REGION: ${REGION:-demo}
      DATA_DIR: /data
    # Write ./data as you, not as the image's nonroot user.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/data

  view:
    image: trail-calc
    depends_on:
      import:
        condition: service_completed_successfully
    entrypoint: ["/app/trail-calc-view"]
    environment:
      REGION: ${REGION:-demo}
      DATA_DIR: /data
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/data

  server:
    image: trail-calc
    depends_on:
      view:
        condition: service_completed_successfully
    environment:
      WINDY_API_KEY: ${WINDY_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
